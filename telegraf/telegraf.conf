# Telegraf: lê as leituras do Mosquitto e grava no InfluxDB 2.x

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "5s"
  omit_hostname = true        # não cria a tag "host": o schema só tem as tags da A.1.b

# ---- ENTRADA: MQTT -------------------------------------------------------------------
# Tópico: friocerto/{regiao}/{loja}/{camara}/telemetria
# Payload: {"sensor_id":"s07","temp_c":4.8,"umid_pct":56.2,"ts":1760000000}
[[inputs.mqtt_consumer]]
  name_override = "temperatura_camara"     # nome do measurement (A.1.b)
  servers = ["tcp://mosquitto:1883"]
  topics = ["friocerto/+/+/+/telemetria"]
  qos = 1                                  # pelo menos uma vez (duplicata é idempotente no InfluxDB)
  persistent_session = true                # o broker guarda as mensagens se o Telegraf cair
  client_id = "telegraf-friocerto"
  connection_timeout = "30s"

  data_format = "json"
  tag_keys = ["sensor_id"]
  json_time_key = "ts"
  json_time_format = "unix"

  # Extrai as tags regiao, loja e camara das posições do tópico
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "friocerto/+/+/+/telemetria"
    tags = "_/regiao/loja/camara/_"

# ---- SAÍDA: InfluxDB 2.x -------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "friocerto"
  bucket = "sensores"

# ---- Healthcheck do próprio Telegraf (usado pelo docker compose) ---------------------
[[outputs.health]]
  service_address = "http://:8080"
