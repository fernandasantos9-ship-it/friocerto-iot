# Mosquitto 2.x, broker MQTT do laboratório FrioCerto
listener 1883 0.0.0.0

# ATENÇÃO: só para o laboratório. Em produção: TLS (porta 8883), usuário/senha ou
# certificado por loja e ACL (cada loja só publica em friocerto/<regiao>/<loja>/#).
allow_anonymous true

# Persistência: mantém sessões e mensagens QoS 1/2 se o broker reiniciar
persistence true
persistence_location /mosquitto/data/

sys_interval 10
connection_messages true
log_dest stdout
log_type error
log_type warning
log_type notice
